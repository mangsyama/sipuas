# =========================================================================
# SIPUAS SERVER BLOCK (UNTUK WINDOWS DEVELOPMENT DENGAN NGINX)
# =========================================================================

server {
    listen 80;
    server_name sipuas.localhost www.sipuas.localhost sipuas.local www.sipuas.local sipuas.test www.sipuas.test;

    root c:/project/sipuas/public;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 100m;

    # Dynamic asset handling
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel Reverb WebSocket & REST API Reverse Proxy
    location ~ ^/(app|apps) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
        access_log off;
    }

    # PHP FastCGI execution for Windows FastCGI (127.0.0.1:9000)
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Deny hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
