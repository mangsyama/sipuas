# SIPUAS SERVER BLOCK (UNTUK WINDOWS DEVELOPMENT)

server {
    listen 80;
    server_name sipuas.localhost www.sipuas.localhost sipuas.local www.sipuas.local sipuas.test www.sipuas.test;

    root c:/project/sipuas/public;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 100m;

    # Dynamic asset handling
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
        access_log off;
    }

    # PHP FastCGI execution for Windows FastCGI (127.0.0.1:9000)
    location ~ \.php$ {
        fastcgi_pass php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Deny hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
